[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialpilot-ai"
version = "0.1.0"
description = "A multi-agent system that researches trends, plans, writes, designs, schedules and analyzes social media content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "feedparser>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
socialpilot = "socialpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socialpilot = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
